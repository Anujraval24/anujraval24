name: Refresh profile cards

on:
  schedule:
    - cron: "17 0 * * *" # every day, 05:47 IST
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "fonts/**"
      - "data/profile.json"
      - ".github/workflows/cards.yml"

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fonttools (provides pyftsubset)
        run: pip install fonttools

      - name: Refresh contribution data
        env:
          # Falls back to the built-in token. Add a PROFILE_TOKEN secret only if
          # the calendar ever comes back empty.
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_data.py

      - name: Render cards
        run: python scripts/render_cards.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data cards
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "chore: refresh profile cards"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
